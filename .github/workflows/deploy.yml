          i=1
          while [ $i -le 3 ]; do
            if curl --max-time 3 -s http://${{ env.REGISTRY }}/v2/ > /dev/null; then
              echo "Registry ${{ env.REGISTRY }} dostępne."
              break
            fi
            echo "[$i/3] Czekam 5s..."
            sleep 5
            i=$((i+1))
          done
          if [ $i -gt 3 ]; then
            echo "Registry ${{ env.REGISTRY }} NIEOSIĄGALNE. Przerywam workflow!"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push watcher image
        uses: docker/build-push-action@v5
        with:
          context: ./watcher
          push: true
          tags: ${{ env.REGISTRY }}/watcher:latest

  lock-ui:
