name: Build & Push RFMM Images

on:
  push:
    branches:
      - main
    paths:
      - 'mqtt-logger/**'
      - 'watcher/**'
      - 'lock-ui/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Wymuś budowanie wszystkich obrazów'
        required: false
        default: 'false'

jobs:
  tailscale-online:
    name: Ensure Tailscale & Registry available
    runs-on: ubuntu-latest
    outputs:
      registry_reachable: ${{ steps.wait.outputs.registry_reachable }}
    steps:
      - name: Install tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start tailscale (with authkey)
        run: |
          sudo tailscale up --authkey ${{ secrets.TS_AUTHKEY }} --ssh --accept-routes --reset

      - name: Wait for Tailscale IP
        run: |
          echo "Czekam na aktywację Tailscale..."
          for i in {1..30}; do
            if tailscale ip -4 | grep -qE '^[0-9]+\.'; then
              echo "Tailscale aktywne!"; break
            else
              echo "Czekam... $i/30"
              sleep 3
            fi
          done

      - name: Wait for registry
        id: wait
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          echo "Testuje dostępność registry $REGISTRY przez 2 minuty..."
          for i in {1..24}; do
            if curl -s http://$REGISTRY/v2/; then
              echo "::set-output name=registry_reachable::true"
              exit 0
            else
              echo "[$i/24] Registry $REGISTRY nieosiągalne. Czekam..."
              sleep 5
            fi
          done
          echo "::set-output name=registry_reachable::false"
          exit 1

  build-logger:
    name: Build & Push Logger
    runs-on: ubuntu-latest
    needs: tailscale-online
    if: needs.tailscale-online.outputs.registry_reachable == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh
      - name: Start tailscale
        run: sudo tailscale up --authkey ${{ secrets.TS_AUTHKEY }} --ssh --accept-routes --reset
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to HTTP registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY }} --username ${{ secrets.REGISTRY_USER }} --password-stdin
      - name: Build and push logger
        uses: docker/build-push-action@v5
        with:
          context: ./mqtt-logger
          push: true
          tags: ${{ secrets.REGISTRY }}/mqtt-logger:latest

  build-watcher:
    name: Build & Push Watcher
    runs-on: ubuntu-latest
    needs: build-logger
    if: needs.build-logger.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Install tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh
      - name: Start tailscale
        run: sudo tailscale up --authkey ${{ secrets.TS_AUTHKEY }} --ssh --accept-routes --reset
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to HTTP registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY }} --username ${{ secrets.REGISTRY_USER }} --password-stdin
      - name: Build and push watcher
        uses: docker/build-push-action@v5
        with:
          context: ./watcher
          push: true
          tags: ${{ secrets.REGISTRY }}/watcher:latest

  build-lockui:
    name: Build & Push Lock UI
    runs-on: ubuntu-latest
    needs: build-watcher
    if: needs.build-watcher.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Install tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh
      - name: Start tailscale
        run: sudo tailscale up --authkey ${{ secrets.TS_AUTHKEY }} --ssh --accept-routes --reset
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to HTTP registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY }} --username ${{ secrets.REGISTRY_USER }} --password-stdin
      - name: Build and push lock-ui
        uses: docker/build-push-action@v5
        with:
          context: ./lock-ui
          push: true
          tags: ${{ secrets.REGISTRY }}/lock-ui:latest
