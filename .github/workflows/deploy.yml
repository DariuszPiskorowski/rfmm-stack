name: Build & Push RFMM Images

on:
  push:
    branches:
      - main
    paths:
      - 'mqtt-logger/**'
      - 'watcher/**'
      - 'lock-ui/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Wymuś budowanie wszystkich obrazów'
        required: false
        default: 'false'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      logger: ${{ steps.filter.outputs.logger }}
      watcher: ${{ steps.filter.outputs.watcher }}
      lockui: ${{ steps.filter.outputs.lockui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            logger:
              - 'mqtt-logger/**'
            watcher:
              - 'watcher/**'
            lockui:
              - 'lock-ui/**'

  tailscale:
    name: Tailscale network join
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Install tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh
      - name: Start tailscale (with authkey)
        run: sudo tailscale up --authkey ${{ secrets.TS_AUTHKEY }} --ssh --accept-routes --reset
      - name: Show Tailscale status
        run: sudo tailscale status
      - name: Wait for registry
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          echo "Testing TCP connectivity to registry $REGISTRY..."
          for i in {1..10}; do
            if curl -s http://$REGISTRY/v2/; then
              echo "Registry $REGISTRY is reachable!"; exit 0;
            else
              echo "Attempt $i: Registry $REGISTRY not reachable yet. Waiting...";
              sleep 5;
            fi
          done
          echo "ERROR: Registry $REGISTRY is not reachable after waiting."; exit 1

  build-logger:
    name: Build & Push Logger
    needs: [detect-changes, tailscale]
    if: needs.detect-changes.outputs.logger == 'true' || github.event.inputs.force_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push logger
        uses: docker/build-push-action@v5
        with:
          context: ./mqtt-logger
          push: true
          tags: ${{ secrets.REGISTRY }}/mqtt-logger:latest

  build-watcher:
    name: Build & Push Watcher
    needs: [detect-changes, tailscale]
    if: needs.detect-changes.outputs.watcher == 'true' || github.event.inputs.force_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push watcher
        uses: docker/build-push-action@v5
        with:
          context: ./watcher
          push: true
          tags: ${{ secrets.REGISTRY }}/watcher:latest

  build-lockui:
    name: Build & Push Lock UI
    needs: [detect-changes, tailscale]
    if: needs.detect-changes.outputs.lockui == 'true' || github.event.inputs.force_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push lock-ui
        uses: docker/build-push-action@v5
        with:
          context: ./lock-ui
          push: true
          tags: ${{ secrets.REGISTRY }}/lock-ui:latest
