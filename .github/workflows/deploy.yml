name: Build & Push RFMM Images

on:
  push:
    branches:
      - main
    paths:
      - 'mqtt-logger/**'
      - 'watcher/**'
      - 'lock-ui/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start tailscale
        run: sudo tailscale up --authkey ${{ secrets.TS_AUTHKEY }} --ssh --accept-routes --reset

      - name: Tailscale IP info
        run: tailscale ip -4 || ifconfig

      - name: Curl po IP
        run: curl -vk http://100.119.56.20:5000/v2/ || true

      - name: Wait for registry (max 15s)
        env:
          REGISTRY: 100.119.56.20:5000
        run: |
          echo "Testuję dostępność registry $REGISTRY (max 15 sekund)..."
          i=1
          while [ $i -le 3 ]; do
            if curl --max-time 3 -s http://$REGISTRY/v2/ > /dev/null; then
              echo "Registry $REGISTRY dostępne."
              break
            fi
            echo "[$i/3] Czekam 5s..."
            sleep 5
            i=$((i+1))
          done
          if [ $i -gt 3 ]; then
            echo "Registry $REGISTRY NIEOSIĄGALNE. Przerywam workflow!"
            exit 1
          fi


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to HTTP registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login 100.119.56.20:5000 --username ${{ secrets.REGISTRY_USER }} --password-stdin

      - name: Build and push logger
        uses: docker/build-push-action@v5
        with:
          context: ./mqtt-logger
          push: true
          tags: 100.119.56.20:5000/mqtt-logger:latest

      - name: Build and push watcher
        uses: docker/build-push-action@v5
        with:
          context: ./watcher
          push: true
          tags: 100.119.56.20:5000/watcher:latest

      - name: Build and push lock-ui
        uses: docker/build-push-action@v5
        with:
          context: ./lock-ui
          push: true
          tags: 100.119.56.20:5000/lock-ui:latest
